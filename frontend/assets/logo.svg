<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Saveflow">
  <!--
    Saveflow mark — vector redraw of referensi/logo.png.
    The source file is an opaque JPEG, so it cannot sit on a dark header;
    this keeps its shape language (ring + download arrow into a tray) and its
    teal-to-blue gradient, on a transparent background and at any size.
  -->
  <defs>
    <linearGradient id="sf-grad" x1="8" y1="10" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#21c8bf" />
      <stop offset="1" stop-color="#2b7fe8" />
    </linearGradient>
  </defs>

  <!-- Orbit ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#sf-grad)" stroke-width="4" />

  <!-- Download arrow -->
  <path d="M27 15h10v17h8L32 47 19 32h8z" fill="url(#sf-grad)" />

  <!-- Receiving tray -->
  <path d="M18 41v9a4 4 0 0 0 4 4h20a4 4 0 0 0 4-4v-9"
        fill="none" stroke="url(#sf-grad)" stroke-width="4.5" stroke-linecap="round" />
</svg>
